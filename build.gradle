plugins {
    id 'com.android.application'
}

def ks = System.getenv("KEYSTORE_FILE")

android {
    namespace 'com.tigeriptv.studio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tigeriptv.studio'
        minSdk 29
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.0.0"
    }

    signingConfigs {
        release {
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "m3u"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = (ks != null && file(ks).exists()) ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
