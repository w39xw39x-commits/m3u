<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M3U</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><img src="icon.png" alt=""><div><b>M3U</b><span>منظّم قنوات IPTV</span></div></div>
    <nav id="nav">
      <button class="nav f" data-act="go" data-arg="subs" data-fid="nav-subs"><i>📡</i><span>الاشتراكات</span></button>
      <button class="nav f" data-act="go" data-arg="packs" data-fid="nav-packs"><i>📦</i><span>الباقات</span></button>
      <button class="nav f" data-act="go" data-arg="browse" data-fid="nav-browse"><i>🗂️</i><span>تصفح المزود</span></button>
      <button class="nav f" data-act="go" data-arg="favs" data-fid="nav-favs"><i>⭐</i><span>المفضلة</span></button>
      <button class="nav f" data-act="go" data-arg="export" data-fid="nav-export"><i>🚀</i><span>إرسال للرسيفر</span></button>
      <button class="nav f" data-act="go" data-arg="settings" data-fid="nav-settings"><i>⚙️</i><span>الإعدادات</span></button>
    </nav>
    <div id="sideinfo"></div>
  </aside>
  <main>
    <header id="top"></header>
    <section id="main"></section>
    <footer id="keys"></footer>
  </main>
</div>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
