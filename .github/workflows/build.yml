name: Build M3U APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange project files
        run: |
          set -e
          D=app/src/main
          mkdir -p $D/java/com/tigeriptv/studio $D/assets/web $D/res/values $D/res/drawable-nodpi
          mvf() { if [ -f "$1" ]; then mv -f "$1" "$2"; fi; }
          mvf app.build.gradle app/build.gradle
          mvf AndroidManifest.xml $D/
          mvf MainActivity.java $D/java/com/tigeriptv/studio/
          mvf WebServer.java $D/java/com/tigeriptv/studio/
          for f in app.css app.js i18n.js icon.png index.html; do mvf $f $D/assets/web/; done
          mvf strings.xml $D/res/values/
          mvf themes.xml $D/res/values/
          mvf banner.png $D/res/drawable-nodpi/
          mvf ic_launcher.png $D/res/drawable-nodpi/
          find . -path ./.git -prune -o -type f -print

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - building with a temporary debug key (updates will need uninstall first)."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/M3U.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: M3U-apk
          path: dist/M3U.apk

      - name: Publish release (fixed download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: M3U v1.0.${{ github.run_number }}
          make_latest: true
          files: dist/M3U.apk
          body: |
            رابط التحميل الثابت (للـ Downloader):
            https://github.com/${{ github.repository }}/releases/latest/download/M3U.apk
